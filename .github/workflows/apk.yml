name: Construire APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Tests du moteur (obligatoires)
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publier l'APK (lien de telechargement direct)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk trend-almaghrib.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk trend-almaghrib.apk --latest --title "ترند المغرب — dernière version" --notes "APK compilé automatiquement depuis le commit ${GITHUB_SHA::7}."
