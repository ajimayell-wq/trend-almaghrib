name: Construire APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decompresser le zip (remplace les dossiers du meme nom)
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
            SRC="$RUNNER_TEMP/src"
            if [ "$(ls -A "$SRC" | wc -l)" = "1" ] && [ -d "$SRC/$(ls -A "$SRC")" ]; then SRC="$SRC/$(ls -A "$SRC")"; fi
            rm -rf "$SRC/.git" "$SRC/.github"
            shopt -s dotglob
            for e in "$SRC"/*; do
              n=$(basename "$e")
              rm -rf "./$n"
              cp -r "$e" "./$n"
            done
            git rm -q "$ZIP"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Decompression du projet"
            git push
          fi

      - name: Trouver le projet Android
        run: |
          GW=$(find . -name gradlew -not -path "./.git/*" | head -n 1)
          if [ -n "$GW" ]; then DIR=$(dirname "$GW"); else DIR=$(dirname "$(find . -name 'settings.gradle*' -not -path './.git/*' | head -n 1)"); fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compiler l'APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Tests du moteur (n'empechent pas la publication de l'APK)
        continue-on-error: true
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/build/outputs/apk/**/*.apk"

      - name: Publier l'APK (lien de telechargement direct)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          cp "$APK" trend-almaghrib.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk trend-almaghrib.apk --latest --title "ترند المغرب — dernière version" --notes "APK compilé automatiquement depuis le commit ${GITHUB_SHA::7}."
