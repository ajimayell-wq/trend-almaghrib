name: Tester les sources

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tester chaque source
        run: python3 tools/check_sources.py | tee -a "$GITHUB_STEP_SUMMARY"
